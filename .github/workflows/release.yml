name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Derive release metadata
        id: metadata
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a semantic version such as v1.0.0" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/student-ml-api" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
        run: |
          docker build \
            --build-arg APPLICATION_VERSION="$VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg REPOSITORY="https://github.com/$GITHUB_REPOSITORY" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$SHORT_SHA" \
            .

      - name: Publish immutable and convenience tags
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
